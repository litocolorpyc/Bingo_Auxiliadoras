<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administración del bingo</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="wrap">
  <section id="login" class="card" hidden style="max-width:380px;margin:40px auto">
    <h1>Administración</h1>
    <form id="form-login">
      <label>Contraseña <input type="password" name="clave" required autofocus></label>
      <div class="actions"><button type="submit">Entrar</button></div>
      <p class="msg bad" id="login-msg"></p>
    </form>
  </section>

  <section id="panel" hidden>
    <div class="row">
      <h1 id="titulo">Bingo</h1>
      <button class="ghost" id="salir" type="button">Salir</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
    <p class="msg" id="msg" role="status"></p>
    <div id="vista"></div>
  </section>
</main>
<script src="admin.js"></script>
</body>
</html>
